schema_version: 1

context:
  name: asio
  version: "1-39-0"

package:
  name: ${{ name|lower }}
  version: ${{ version | replace('-','.') }}

source:
  url: https://github.com/chriskohlhoff/${{ name }}/archive/${{ name }}-${{ version }}.tar.gz
  sha256: cc27087fad4b6d85c6b8e4c896c57144b417cfc5a5eab9e204565f51adaec1de

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - pkgconf
    - if: unix
      then: autoconf
    - if: unix
      then: automake
    - if: unix
      then: make

tests:
  - script:
      - if: unix
        then: test -f $PREFIX/include/asio.hpp
      - if: unix
        then: test -f $PREFIX/include/asio/error.hpp
      - if: win
        then: if exist %PREFIX%\\Library\\include\\asio.hpp (exit 0) else (exit 1)
      - if: win
        then: if exist %PREFIX%\\Library\\include\\asio\\error.hpp (exit 0) else (exit 1)

about:
  license: BSL-1.0
  license_file:
    - COPYING
    - LICENSE_1_0.txt
  summary: |
    Asio is a cross-platform C++ library for network and low-level I/O programming that
    provides developers with a consistent asynchronous model using a modern C++ approach.


  homepage: https://github.com/chriskohlhoff/asio

extra:
  recipe-maintainers:
    - seanyen
    - traversaro
